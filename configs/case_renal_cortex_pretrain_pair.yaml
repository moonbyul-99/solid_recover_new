# hca_renal_cortex 单组学预训练 + 配对联合训练 统一配置
# 删除 pretrain_rna / pretrain_atac 段落即退化为普通 pair_scratch
task: "pair_scratch"

data:
  train_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/multi_omics/hca_renal_cortex/train.h5mu"
  test_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/multi_omics/hca_renal_cortex/test.h5mu"
  key_1: "rna_count"
  key_2: "peak_count"
  batch_size: 512

model:
  feature_num_1: 14577
  feature_num_2: 101123
  hidden_params_1: [1024, 256]
  hidden_params_2: [1024, 256]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.0

# ====== 单组学预训练（可选；删除此两段落则退化为普通 pair_scratch） ======
pretrain_rna:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair/rna_pretrain"
  train_steps: 4000
  eval_points: 200
  save_points: 4000
  batch_size: 256
  lr: 1e-3
  warmup_steps: 400
  steady_1_steps: 0
  cosine_anneal_steps: 3600
  min_lr: 1e-4
  vae_beta: 1.0

pretrain_atac:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair/atac_pretrain"
  train_steps: 4000
  eval_points: 200
  save_points: 4000
  batch_size: 256
  lr: 1e-3
  warmup_steps: 400
  steady_1_steps: 0
  cosine_anneal_steps: 3600
  min_lr: 1e-4
  vae_beta: 1.0

training:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair/pair_pretrain"
  train_steps: 6000
  eval_points: 200
  save_points: 500
  device: "cuda"

optimizer:
  lr: 2e-4
  warmup_steps: 500
  steady_1_steps: 500
  cosine_anneal_steps: 5000
  min_lr: 5e-5

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 20.0
  cross_recon_1: 0.75
  cross_recon_2: 0.75
  temperature: 0.12
  use_weight: true
  top_k_ratio: 0.1
  bottom_k_ratio: 0.02
  weight_top: 0.1
  weight_bottom: 2.0
