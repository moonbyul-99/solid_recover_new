# hca_renal_cortex 单组学预训练（10K步, v2 LR调度） + 配对联合训练 v4
# 预训练: 10K步, 每2K保存ckpt, LR fast anneal (v2: 4K→1e-4), dropout=0.0
# 配对: t=0.15, bottom_k_ratio=0.15, clip_weight=20, dropout=0.1

task: pair_pretrain

data:
  train_data_path: "/home/rsun@ZHANGroup.local/solid_recover_main/paper_figure/hca_renal_cortex/train.h5mu"
  test_data_path: "/home/rsun@ZHANGroup.local/solid_recover_main/paper_figure/hca_renal_cortex/test.h5mu"
  key_1: rna_count
  key_2: peak_count
  batch_size: 512
  to_gpu: true

model:
  feature_num_1: 14577
  feature_num_2: 101123
  hidden_params_1: [1024, 256]
  hidden_params_2: [1024, 256]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.1

# ====== 单组学预训练: 10K步, v2 LR调度(4K→1e-4后plateau), 每2K存ckpt ======
pretrain_rna:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair_v4/rna_pretrain"
  train_steps: 10000
  eval_points: 200
  save_points: 2000
  batch_size: 256
  lr: 1e-3
  warmup_steps: 400
  steady_1_steps: 0
  cosine_anneal_steps: 3600
  min_lr: 1e-4
  vae_beta: 1.0

pretrain_atac:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair_v4/atac_pretrain"
  train_steps: 10000
  eval_points: 200
  save_points: 2000
  batch_size: 256
  lr: 1e-3
  warmup_steps: 400
  steady_1_steps: 0
  cosine_anneal_steps: 3600
  min_lr: 1e-4
  vae_beta: 1.0

training:
  project_dir: "outputs/hca_renal_cortex_pretrain_pair_v4/pair_pretrain"
  train_steps: 6000
  eval_points: 200
  save_points: 500
  device: "cuda"

optimizer:
  lr: 2e-4
  warmup_steps: 500
  steady_1_steps: 500
  cosine_anneal_steps: 5000
  min_lr: 5e-5

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 20.0
  cross_recon_1: 0.75
  cross_recon_2: 0.75
  temperature: 0.15
  use_weight: true
  top_k_ratio: 0.1
  bottom_k_ratio: 0.15
  weight_top: 0.1
  weight_bottom: 5.0

ckpt:
  omic_1: "outputs/hca_renal_cortex_pretrain_pair_v4/rna_pretrain/models/ckpt_10000.pth"
  omic_2: "outputs/hca_renal_cortex_pretrain_pair_v4/atac_pretrain/models/ckpt_10000.pth"
